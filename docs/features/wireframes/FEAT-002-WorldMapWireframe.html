<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>FEAT-002 · WorldMap 线框</title>
<style>
  body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0}
  .workspace{display:flex;gap:12px;padding:12px;height:100vh;box-sizing:border-box}
  .svg-panel{flex:0 0 auto;background:#1e293b;border-radius:8px;padding:8px}
  .svg-panel svg{width:min(58vw,1180px);height:auto;background:#0b1220;border-radius:4px}
  .right-col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:360px;overflow:hidden}
  .panel{background:#1e293b;border-radius:8px;padding:12px;overflow:auto}
  .inspector{flex:1 1 auto}
  .tree-panel{flex:0 0 30%}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin:10px 0 6px}
  h2:first-child{margin-top:0}
  g.node{cursor:pointer}
  g.node>.hit{fill:transparent;stroke:transparent;transition:all .12s;pointer-events:all}
  g.node:hover>.hit{fill:rgba(252,211,77,.10);stroke:#fbbf24;stroke-width:2}
  g.node.selected>.hit{fill:rgba(239,68,68,.18);stroke:#ef4444;stroke-width:3}
  .b,.ins-b{display:inline-block;padding:1px 6px;margin-left:3px;border-radius:7px;font-size:10.5px;font-weight:700;color:#fff;cursor:help}
  .b-assign{background:#2563eb}.b-click{background:#f59e0b}.b-hover{background:#7c3aed}.b-state{background:#f43f5e}.b-copy{background:#10b981}
  .d{display:inline-block;padding:2px 8px;margin-left:4px;border-radius:6px;font-size:12px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.55)}
  .d-new{background:#16a34a}.d-changed{background:#ea580c}.d-moved{background:#0284c7}.d-removed{background:#dc2626}
  #changes{border:2px solid #334155;flex:0 0 auto}
  #changes .chg{cursor:pointer;padding:4px 6px;border-radius:5px;margin:2px 0}
  #changes .chg:hover{background:rgba(234,88,12,.15)}
  #breadcrumb{font-size:12px;color:#cbd5e1;line-height:1.7}
  #breadcrumb .crumb{cursor:pointer;color:#7dd3fc}
  #breadcrumb .crumb:hover{text-decoration:underline}
  .row{font-size:12.5px;line-height:1.65;margin:2px 0}
  .row b{color:#f1f5f9}
  .k{color:#94a3b8;display:inline-block;min-width:64px}
  .beh{border-left:3px solid #475569;padding:4px 8px;margin:5px 0;background:rgba(15,23,42,.6);border-radius:0 5px 5px 0}
  .beh .bn{font-weight:700;font-size:12px}
  .beh .bw{font-size:11.5px;color:#cbd5e1;margin-top:3px;line-height:1.55}
  .child{cursor:pointer;padding:3px 6px;border-radius:5px;font-size:12px}
  .child:hover{background:rgba(125,211,252,.14)}
  #tree{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.62}
  #tree .tr{cursor:pointer;padding:1px 4px;border-radius:4px;white-space:pre}
  #tree .tr:hover{background:rgba(125,211,252,.14)}
  #tree .tr.selected{background:rgba(239,68,68,.24)}
  .ctrl3d{fill:#1e2a3d;stroke:#475569;stroke-dasharray:6 4}
  .lbl{font-family:system-ui,sans-serif;fill:#e2e8f0}
  .dim{fill:#94a3b8}
  .note{font-size:11px;color:#94a3b8;line-height:1.6}

<script>
const BASELINE = null; // 全新界面：WorldMap 模块尚无归档线框

const NODES = {
  'root': {name:'WorldMapScreen', ctrl:'Node3D', module:'WorldMap', term:'世界地图', size:'—（3D 场景根）', desc:'世界地图根节点。作为 main.tscn 的子节点存在，像 start_screen 一样 show/hide，不切换根场景（共识 4）。',
    state:true, stateWhat:'main.gd 的 _show_world_map() / _hide_world_map() 切 visible。进标题页时隐藏、点「开始/继续」时显示、_enter_stage() 后隐藏。⚠️ 同时必须把 main.tscn 的 2D 布景（Backdrop / Background / 两侧林叶 / CentralTreeBackground / BoardPlatform / Scenery / 五个鸟架）一起 visible=false——3D 先渲染、2D CanvasItem 盖在上面，不收走的话整张地图被那棵大树严丝合缝地挡死。见 main.gd 的 _set_scenery_visible()。'},

  'hex-terrain': {name:'HexTerrain', ctrl:'Node3D', module:'WorldMap', term:'地格', size:'~150 个子节点', desc:'手工摆放的地格与装饰，纯美术资产，不受控（共识 3）。子节点是 KayKit gltf 实例：tiles/base·coast·rivers·roads + decoration/nature·props。', parent:'root'},

  'stage-markers': {name:'StageMarkers', ctrl:'Node3D', module:'WorldMap', term:'关卡', size:'15-20 个子节点', desc:'关卡节点容器。每个子节点只挂一个 stage_id 去 StageTable 查表，不在场景里存任何数值（共识 3）。', parent:'root',
    assign:true, assignWhat:'WorldMap._ready() 遍历子节点，读各自导出的 stage_id → StageTable.stage(id) 取名字/目标盘数/所属区 → 为每个节点生成一张 StageBadge。⚠️ 需新增 StageTable'},
  'stage-marker': {name:'StageMarker', ctrl:'Node3D', module:'WorldMap', term:'关卡', size:'一块地格大小', desc:'单个关卡节点（模板）。导出属性只有 stage_id: StringName。悬浮牌靠它的 global_position 做屏幕投影定位。', parent:'stage-markers',
    copy:true, copyWhat:'15-20 个实例在 world_map.tscn 里手工摆放，各自填不同的 stage_id。运行时不实例化。',
    hover:true, hoverWhat:'鼠标射线命中时（Camera3D.project_ray_origin + 一个 Area3D）让对应 StageBadge 抬升+放大。⚠️ 需新增：3D 拾取，全项目现无 3D 代码'},

  'map-camera': {name:'MapCamera', ctrl:'Camera3D', module:'WorldMap', size:'—', desc:'斜俯视相机。拖拽平移 + 滚轮缩放（共识 4），须有边界限位与缩放区间。', parent:'root',
    click:true, clickWhat:'_unhandled_input：按下记起点 → 移动时改 position（平移）→ 抬起时若总位移 < DRAG_SLOP(8px) 才当作点击关卡，否则吞掉（共识 4 的误触判定）。滚轮改与地面的距离，clamp 在 [ZOOM_MIN, ZOOM_MAX]。⚠️ 全新'},
  'map-sun': {name:'MapSun', ctrl:'DirectionalLight3D', module:'WorldMap', size:'—', desc:'唯一光源。KayKit 素材是无光照贴图风格，一盏平行光 + 环境光即可。不受控。', parent:'root'},

  'ui': {name:'WorldMapUi', ctrl:'CanvasLayer', module:'WorldMap', size:'1920×1080', desc:'地图屏的全部 2D UI。独立 CanvasLayer，layer 取 60（低于商店 100 与光标特效 400）。**整棵 UI 子树由 world_map.gd 在运行时搭建，不存在于 .tscn 里**——与项目现有 main.gd 的 _build_* 一套做法一致，这样手改场景不会一保存就把节点抹掉，也让那张 .tscn 保持为纯美术资产。', parent:'root'},

  'top-bar': {name:'TopBar', ctrl:'HBoxContainer', module:'WorldMap', size:'1920×96', desc:'常驻顶栏。锚 PRESET_TOP_WIDE。', parent:'ui'},
  'back-btn': {name:'BackToTitleButton', ctrl:'Button', module:'GameFlow', size:'188×56', desc:'返回标题页（共识 5 的四件常驻之一）。', parent:'top-bar',
    click:true, clickWhat:'pressed → WorldMap.title_requested 信号 → main.gd 隐藏地图并 _build_start_screen()。复用现有 _build_start_screen()（main.gd:614）与 _refresh_title_save_state()（main.gd:633），均已 grep 确认存在。'},
  'region-name': {name:'RegionNameLabel', ctrl:'Label', module:'WorldMap', term:'地形区', size:'420×36', desc:'当前地形区名。', parent:'top-bar',

const TAG_META = {
  state:  { label:'状态', cls:'b-state',  name:'显隐切换 (visible)', defWhy:'脚本通过 visible 控显隐' },
  hover:  { label:'悬停', cls:'b-hover',  name:'悬停逻辑 (Hover)',   defWhy:'连 mouse_entered/exited' },
  click:  { label:'点击', cls:'b-click',  name:'点击逻辑 (Click)',   defWhy:'连 pressed / gui_input' },
  assign: { label:'赋值', cls:'b-assign', name:'赋值逻辑 (Assign)',  defWhy:'运行时写入内容' },
  copy:   { label:'拷贝', cls:'b-copy',   name:'实例化模板 (Copy)',  defWhy:'作为模板被实例化多份' }
};
const DIFF_META = {
  new:     { label:'🆕 新增', cls:'d-new' },
  changed: { label:'✏️ 改动', cls:'d-changed' },
  moved:   { label:'↔️ 移位', cls:'d-moved' },
  removed: { label:'🗑️ 删除', cls:'d-removed' }
};
function getNodeTags(node){
  const t=[];
  if(node.copy)  t.push({key:'copy', ...TAG_META.copy,  why:node.copyWhat  ||TAG_META.copy.defWhy});
  if(node.state) t.push({key:'state',...TAG_META.state, why:node.stateWhat ||TAG_META.state.defWhy});
  if(node.hover) t.push({key:'hover',...TAG_META.hover, why:node.hoverWhat ||TAG_META.hover.defWhy});
  if(node.click) t.push({key:'click',...TAG_META.click, why:node.clickWhat ||TAG_META.click.defWhy});
  if(node.assign)t.push({key:'assign',...TAG_META.assign,why:node.assignWhat||TAG_META.assign.defWhy});
  return t;
}
function getNodeDiff(node){ return node.diff ? {...DIFF_META[node.diff], why:node.diffWhat||''} : null; }

function buildPath(id){const p=[];let c=id;while(c&&NODES[c]){p.unshift({id:c,...NODES[c]});c=NODES[c].parent}return p}
function getChildren(id){return Object.entries(NODES).filter(([_,n])=>n.parent===id).map(([cid,n])=>({id:cid,...n}))}
function tagChips(n){return getNodeTags(n).map(t=>`<span class="b ${t.cls}" title="${t.why.replace(/"/g,'&quot;')}">${t.label}</span>`).join('')}

function buildTree(){
  const out=[];
  (function walk(id,depth){
    const n=NODES[id]; if(!n) return;
    out.push(`<div class="tr" data-node-id="${id}">${'  '.repeat(depth)}${depth?'└ ':''}<b>${n.name}</b> <span class="dim" style="color:#94a3b8">[${n.ctrl}]</span> ${tagChips(n)}${n.anno?` <span style="color:#f43f5e">${n.anno}</span>`:''}</div>`);
    getChildren(id).forEach(c=>walk(c.id,depth+1));
  })('root',0);
  const tree=document.getElementById('tree');
  tree.innerHTML=out.join('');
  tree.querySelectorAll('.tr').forEach(el=>el.addEventListener('click',()=>selectNode(el.getAttribute('data-node-id'))));
}

function selectNode(id){
  const n=NODES[id]; if(!n) return;
  document.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll(`svg [data-node-id="${id}"]`).forEach(el=>el.classList.add('selected'));
  const row=document.querySelector(`#tree [data-node-id="${id}"]`);
  if(row){row.classList.add('selected');row.scrollIntoView({block:'nearest',behavior:'smooth'})}

  document.getElementById('breadcrumb').innerHTML=buildPath(id)
    .map(p=>`<span class="crumb" data-jump="${p.id}">${p.name}</span>`).join(' <span style="color:#475569">›</span> ');
  document.querySelectorAll('#breadcrumb .crumb').forEach(el=>el.addEventListener('click',()=>selectNode(el.getAttribute('data-jump'))));

  document.getElementById('details').innerHTML=
    `<div class="row"><span class="k">节点名</span><b>${n.name}</b>${n.anno?` <span style="color:#f43f5e">${n.anno}</span>`:''}</div>`+
    `<div class="row"><span class="k">控件</span><b>${n.ctrl}</b></div>`+
    `<div class="row"><span class="k">模块</span>${n.module||'—'}</div>`+
    (n.term?`<div class="row"><span class="k">术语</span>${n.term}</div>`:'')+
    `<div class="row"><span class="k">尺寸</span>${n.size||'—'}</div>`+
    `<div class="row" style="margin-top:6px;color:#cbd5e1">${n.desc||''}</div>`;

  const d=getNodeDiff(n);
  document.getElementById('diffbox').innerHTML = d
    ? `<div class="row"><span class="d ${d.cls}">${d.label}</span> ${d.why}</div>`
    : `<div class="row" style="color:#64748b">${BASELINE?'相对归档线框无变化':'全新界面，无归档基线可比'}</div>`;

  const tags=getNodeTags(n);
  document.getElementById('behaviors').innerHTML = tags.length
    ? tags.map(t=>`<div class="beh"><div class="bn"><span class="b ${t.cls}">${t.label}</span> ${t.name}</div><div class="bw">${t.why}</div></div>`).join('')
    : `<div class="row" style="color:#64748b">静态节点，脚本不访问</div>`;

  const kids=getChildren(id);
  document.getElementById('children').innerHTML = kids.length
    ? kids.map(c=>`<div class="child" data-jump="${c.id}"><b>${c.name}</b> <span style="color:#94a3b8">[${c.ctrl}]</span> ${tagChips(c)}</div>`).join('')
    : `<div class="row" style="color:#64748b">无子节点</div>`;
  document.querySelectorAll('#children .child').forEach(el=>el.addEventListener('click',()=>selectNode(el.getAttribute('data-jump'))));
}

function bindSVG(){
  document.querySelectorAll('svg g.node').forEach(g=>g.addEventListener('click',e=>{
    e.stopPropagation(); selectNode(g.getAttribute('data-node-id'));
  }));
}

function buildChanges(){
  const box=document.getElementById('changes');
  document.getElementById('changes-base').textContent = BASELINE ? ('基线: '+BASELINE)
    : '全新界面（WorldMap 模块尚无归档线框，本 FEAT 为首张）。that-is-all 时新建 docs/modules/WorldMap/WorldMapWireframe.html。';
  const diffs=Object.entries(NODES).filter(([_,n])=>n.diff);
  if(!BASELINE || !diffs.length){ box.querySelector('h2').textContent = BASELINE?'本次改动: 无结构变化':'全新界面'; return; }
  const list=document.getElementById('changes-list');
  list.innerHTML = diffs.map(([id,n])=>{const d=getNodeDiff(n);
    return `<div class="chg" data-jump="${id}"><span class="d ${d.cls}">${d.label}</span> <b>${n.name}</b> — ${n.diffWhat||''}</div>`}).join('');
  list.querySelectorAll('.chg').forEach(el=>el.addEventListener('click',()=>selectNode(el.getAttribute('data-jump'))));
}

buildTree(); bindSVG(); buildChanges(); selectNode('root');
</script>
